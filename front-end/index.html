<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>poke-catch</title>
    
</head>
<body>
    <div id="tela-inicial" class="container-tela-inicial">
        <h1> POKE <br> CATCH </h1>
        <div class="container-info-inicial">
        <p>Digite seu nome, jogador!:</p>
        <input type="text" id="nome-jogador" placeholder="Nome">

        <p>Escolha seu personagem:</p>
    <div class="container-personagens">
        <label>
            <input type="radio" name="avatar" value="https://play.pokemonshowdown.com/sprites/trainers/red.png" checked>
            <img src="https://play.pokemonshowdown.com/sprites/trainers/red.png" alt="Menino">
        </label>
        
        <label>
            <input type="radio" name="avatar" value="https://play.pokemonshowdown.com/sprites/trainers/leaf.png">
            <img src="https://play.pokemonshowdown.com/sprites/trainers/may.png" alt="Menina">
        </label>
    </div>

        <button>Começar aventura!</button>
        </div>
    </div>

    <div id="tela-mapa" class="container-tela-mapa">
        <select name="" id="selecao-mapa" required class="selecao-mapa"> 
            <option value="" selected disabled> Explore o Mapa! </option>
            <option value="palletTown">Pallet Town</option>
            <option value="viridianCity">Viridian City</option>
        </select>

        <div class="botao-tela-mapa">
        <button class="botao-procurar-pokemon">Procurar Pokémon</button>
        <button id="btn-abrir-pc">Abrir PC / Mochila</button>
        </div>
    </div>

    <div id="tela-captura" class="container-tela-captura">

    <div id="pokemon-selvagem">
        <h2 id="nome-pokemon-selvagem" >Um Pokémon apareceu!</h2>
        <img id="img-pokemon-selvagem" src="" alt="Pokemon selvagem" width="150">
    </div>

    <div class="container-info-captura">
    <div class="container-info-pokemon">
        <label for="">
            <p>Apelido do Pokemon</p>
        <input type="text" name="" id="apelido-pokemon" placeholder="Apelido do Pokémon">
        </label>

        <label for="">
            <p>Nível do Pokemon</p>
        <input type="number" name="" id="nivel-pokemon" placeholder="Nível do Pokémon">
        </label>

        <label for="">
            <p>Data da Captura</p>
        <input type="date" name="" id="data-captura" placeholder="Data da Captura">
        </label>
    </div>
    
    <div class="container-pokebola">
        <label for=""> 
            <input type="radio" name="tipoPokebola" id="pokebola-padrao"> Pokebola Padrão 
        </label>

        <label for=""> 
            <input type="radio" name="tipoPokebola" id="grat-ball"> Great Ball 
        </label>
        
        <label for=""> 
            <input type="radio" name="tipoPokebola" id="ultra-ball"> Ultra Ball 
        </label>
    </div>

    <div class="container-estado">
        <p>Estado do Pokemon</p>
        <div class="divisao-estado">
        <label for=""> 
            <input type="checkbox" name="" id="paralisado"> Paralisado 
        </label>

        <label for=""> 
            <input type="checkbox" name="" id="dormindo"> Dormindo 
        </label>

        <label for=""> 
            <input type="checkbox" name="" id="envenenado"> Envenenado 
        </label>

        <label for=""> 
            <input type="checkbox" name="" id="queimado"> Queimado 
        </label>
        </div>
    </div>
    <button class="botao-lancar">Lançar Pokebola</button>
    </div>

    
    </div>

    <div id="tela-resultado">
        <div class="container-resultado">
        <div id="pokemon-selvagem">
        <h2 id="mensagem-resultado">Pokémon Capturado com Sucesso!</h2>
        </div>

        <img id="img-resultado" src="" alt="Pokemon Capturado" width="150">
        
        <div id="info-captura">
            <p class="info-captura"><strong>Apelido:</strong> <span id="res-apelido"></span></p>
            <p class="info-captura"><strong>Nível:</strong> <span id="res-nivel"></span></p>
            <p class="info-captura"><strong>Pokébola:</strong> <span id="res-pokebola"></span></p>
        </div>
        </div>

        <button id="btn-procurar-mais">Procurar mais Pokémon</button>
    </div>

    <div id="tela-pc" style="display: none;">
        <h2 class="titulo-pc">PC do Treinador</h2>

        <div id="container-pokemons"></div> 
    
        <br>
        <button id="btn-voltar-mapa-pc">Desligar PC e Voltar</button>
    </div>

    <script src="script.js"> </script>
</body>
</html>
